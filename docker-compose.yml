services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whale-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-whale_mas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-whale-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-whale-minio-password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-whale-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-whale-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-whale-mas}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set whale http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "whale/$${MINIO_BUCKET}"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: Whale MAS
      APP_ENV: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-whale}:${POSTGRES_PASSWORD:-whale-dev-password}@postgres:5432/${POSTGRES_DB:-whale_mas}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-whale}:${POSTGRES_PASSWORD:-whale-dev-password}@postgres:5432/${POSTGRES_DB:-whale_mas}
      LANGGRAPH_STRICT_MSGPACK: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-whale-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-whale-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-whale-mas}
      MINIO_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  minio_data:
